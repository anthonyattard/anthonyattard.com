server_tokens off;

# Respect the original scheme when running behind a TLS-terminating proxy.
map $http_x_forwarded_proto $redirect_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Force non-www.
server {
    listen 80;
    server_name www.anthonyattard.com;
    return 301 $redirect_scheme://anthonyattard.com$request_uri;
}

server {
    listen 80 default_server;
    server_name anthonyattard.com _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so the container's internal port never leaks.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/xml text/xml font/ttf font/otf application/vnd.ms-fontobject;

    # 301s for old URLs.
    rewrite ^/(.*/)?resume/?$  /Anthony-Attard-Resume.pdf permanent;
    rewrite ^/(.*/)?contact/?$ /                          permanent;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles (regex locations match in order, so keep this first).
    location ~ /\. {
        return 404;
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
    }

    location ~* \.(?:png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot|pdf)$ {
        expires 30d;
    }
}
